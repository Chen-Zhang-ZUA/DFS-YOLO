# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLO11 object detection model with P3-P5 outputs. For Usage examples see https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 
scales: 
  s: [0.50, 0.50, 1024] 

Warehouse_Manager: True
Warehouse_Manager_Ratio: 1.0


backbone:

  - [-1, 1, DMB, [64, 3, 2]] # 0-P1/2
  - [-1, 1, DMB, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_DMB, [256, False, 0.25]]
  - [-1, 1, DMB, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DMB, [512, False, 0.25]]
  - [-1, 1, DMB, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DMB, [512, True]]
  - [-1, 1, DMB, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_DMB, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2_DMB, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [2, 1, SPDConv, [256]] # 15 (P3/8-small)
  - [[-1, -2, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 1, CSPOKnet, []] # 17
  - [-1, 2, C3k2_DMB, [256, False]] # 18 (P3/8-small)

  - [-1, 1, DMB, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2_DMB, [512, False]] # 21 (P4/16-medium)

  - [[3, 18], 1, SCA_Fusion, []] # 22 (P3/8-small)
  - [[6, 21], 1, SCA_Fusion, []] # 23 (P4/16-medium)

  - [[22, 23], 1, Detect, [nc]] # Detect(P3, P4)

